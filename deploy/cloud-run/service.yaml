# Cloud Run service for the hosted private preview. deploy.sh fills the ${...} placeholders.
# Why these settings: docs/decisions/0014-hosted-private-preview.md.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE}
  labels:
    cloud.googleapis.com/location: ${REGION}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # One instance at most: the app's file locks, caches and limits assume a single process.
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
        # Volume mounts need the second-generation environment.
        run.googleapis.com/execution-environment: gen2
        # Request-based billing: CPU is allocated (and billed) only while a request is open, so
        # an idle instance, or a visitor without an invite, costs nothing.
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 40
      # Long enough for a large bill's ingest stream.
      timeoutSeconds: 3600
      serviceAccountName: ${SERVICE_ACCOUNT}
      containers:
        - image: ${IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '2'
              memory: 4Gi
          env:
            - name: LAWGLASS_BACKEND
              value: local
            - name: LAWGLASS_LLM_PROVIDER
              value: anthropic
            - name: LAWGLASS_MAX_DOCS
              value: '30'
            - name: LAWGLASS_PUBLIC_ORIGIN
              value: ${PUBLIC_ORIGIN}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api-key
                  key: latest
            - name: LAWGLASS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lawglass-access-key
                  key: latest
          volumeMounts:
            - name: snapshots
              mountPath: /snapshots
      volumes:
        - name: snapshots
          csi:
            driver: gcsfuse.run.googleapis.com
            volumeAttributes:
              bucketName: ${BUCKET}
              # The container runs as the image's `node` user (uid 1000).
              mountOptions: uid=1000,gid=1000,file-mode=600,dir-mode=700
