name: Nightly

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # onnxruntime-node's postinstall downloads optional CUDA binaries from api.nuget.org on Linux.
  # The local models run on CPU (those binaries ship in the package), and that download has
  # timed out on runners, failing npm ci. Skip it.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  pinecone-contract:
    name: pinecone-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Secrets are unavailable in job-level if expressions; gate every later step.
      - name: Check Pinecone credentials
        id: credentials
        env:
          # Only a boolean reaches this step; the secret value is never exposed here.
          HAS_PINECONE_KEY: ${{ secrets.PINECONE_API_KEY != '' }}
        run: |
          if [ "$HAS_PINECONE_KEY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pinecone contract tests skipped: PINECONE_API_KEY is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.credentials.outputs.enabled == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.credentials.outputs.enabled == 'true' }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: ${{ steps.credentials.outputs.enabled == 'true' }}
      # The key is scoped to this step only (not visible to npm ci lifecycle scripts).
      - run: npm run test:live
        if: ${{ steps.credentials.outputs.enabled == 'true' }}
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      # TODO(live-provider-ping): add a nightly provider ping when adapters exist.
