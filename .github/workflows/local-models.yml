name: Local backend

on:
  push:
  pull_request:

jobs:
  local-models:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    env:
      LEGSUM_CONFIG_DIR: ${{ github.workspace }}/.cache/local-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/cache@v4
        with:
          path: .cache/local-backend/models
          key: local-models-${{ runner.os }}-${{ hashFiles('models.lock.json', 'package-lock.json') }}
      - run: npm run models:fetch
      - run: npm run test:models
