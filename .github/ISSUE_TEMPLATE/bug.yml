name: Bug
description: Something is broken
labels: ['type:bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed vs. expected behavior, with exact error text.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
